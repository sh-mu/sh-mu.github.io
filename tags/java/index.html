      function setupScrollFeatures() {
        // 1. Reading Progress Bar
        const progressBar = document.getElementById('reading-progress');
        const scrollBtn = document.getElementById('scroll-to-top');

        const handleScroll = () => {
          const windowScroll = window.scrollY || document.documentElement.scrollTop;
          const documentHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          
          if (progressBar) {
            const scrollPercent = (windowScroll / documentHeight) * 100;
            progressBar.style.width = scrollPercent + '%';
          }

          if (scrollBtn) {
            if (windowScroll > 300) {
              scrollBtn.classList.add('visible');
            } else {
              scrollBtn.classList.remove('visible');
            }
          }
        };

        document.addEventListener('scroll', handleScroll, { passive: true });
        
        if (scrollBtn) {
          scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
      }

      function setupThemeToggle() {
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        const updateIcons = (theme) => {
          if (theme === 'dark') {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
          } else {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
          }
        };

        const currentTheme = document.documentElement.getAttribute('data-theme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        updateIcons(currentTheme);

        if (themeToggle) {
          themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons(newTheme);
          });
        }
      }

      function initLayout() {
        setupScrollFeatures();
        setupThemeToggle();
      }

      document.addEventListener('astro:page-load', initLayout);
      if (document.readyState === 'complete') initLayout();
      else window.addEventListener('DOMContentLoaded', initLayout);
    </script></body></html>
